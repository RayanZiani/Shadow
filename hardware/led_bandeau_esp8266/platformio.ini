; PlatformIO — bandeau LED ESP8266 (consigne additionnelle).
;
; Ouvrir CE DOSSIER dans JetBrains CLion avec le plugin PlatformIO :
;   CLion → Open → hardware/led_bandeau_esp8266/platformio.ini
; puis « PlatformIO → Build » et « PlatformIO → Upload ».
;
; La carte est un ESP8266 (Wemos D1 mini / NodeMCU). Le framework Arduino est
; utilisé pour la bibliothèque WiFi ; le code reste du C++ (main.cpp), compilé
; par la toolchain PlatformIO, pas par l'IDE Arduino.
;
; Prérequis : copier `src/secrets.example.h` en `src/secrets.h` et renseigner
; le SSID / mot de passe du point d'accès RESILIENCE-G<n>.

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -Wall
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
