# Règles d'alerte — RESILIENCE-ALPHA
#
# Principe de rédaction : chaque alerte correspond à une panne RÉELLEMENT
# rencontrée pendant le projet (voir docs/COMPTE-RENDU.md §9). Une alerte qui
# ne s'est jamais déclenchée n'a pas sa place ici.
#
# Ce que l'on n'alerte PAS : « une attaque est en cours ». C'est le travail du
# détecteur, et une attaque détectée est le comportement ATTENDU du système.
# On alerte sur ce qui casse la démonstration : le silence.

groups:
  - name: chaine-p0
    rules:
      # Le détecteur ne peut pas conclure : artefacts absents ou corrompus.
      # Cause vécue : image construite sans les .joblib/.pt (le Dockerfile ne
      # testait que threshold.json).
      - alert: ModeleMLIndisponible
        expr: shadow_model_ready == 0
        for: 1m
        labels: { severity: critical, pilier: "IA/DATA" }
        annotations:
          summary: "ml-detector est en mode dégradé"
          description: >-
            Le modèle ou le seuil n'est pas chargé : aucune remédiation ne sera
            déclenchée. `docker compose build ml-detector` puis vérifier
            `curl localhost:8083/healthz`.

      # Le webhook de remédiation est cassé : le détecteur voit l'attaque mais
      # ne peut prévenir personne. C'est LA panne silencieuse du projet.
      - alert: WebhookRemediationCasse
        expr: shadow_webhook_error == 1
        for: 1m
        labels: { severity: critical, pilier: "IA/DATA" }
        annotations:
          summary: "le webhook de remédiation a échoué"
          description: >-
            `last_webhook_error` est non nul dans /healthz. Aucun incident
            n'arrivera au moteur : la démo échouera sans message.

      # Un seuil de calibration périmé a été trouvé et refusé. Le détecteur
      # fonctionne, mais avec le seuil appris, pas celui qui avait été mesuré.
      - alert: SeuilRuntimePerime
        expr: shadow_runtime_threshold_ignored == 1
        for: 1m
        labels: { severity: warning, pilier: "IA/DATA" }
        annotations:
          summary: "un threshold_runtime.json périmé a été refusé"
          description: >-
            Le fichier a été mesuré sur un autre modèle. Recapturer :
            `capture_baseline.py` puis `calibrate_threshold.py`.

      # Le moteur de remédiation est tombé : plus de source de vérité d'état,
      # donc plus de dashboard ni de terminal cohérents.
      - alert: MoteurRemediationIndisponible
        expr: up{job="remediation-engine"} == 0
        for: 30s
        labels: { severity: critical, pilier: INFRA }
        annotations:
          summary: "remediation-engine est arrêté"
          description: >-
            L'état du système n'est plus publié. Le dashboard affichera
            « SSE KO ». `docker compose up -d remediation-engine`.

      # Un playbook qui échoue : la remédiation n'a pas eu lieu.
      - alert: RemediationEnEchec
        expr: increase(shadow_playbook_failures_total[10m]) > 0
        for: 1m
        labels: { severity: critical, pilier: INFRA }
        annotations:
          summary: "un playbook de remédiation a échoué"
          description: >-
            Voir `remediation-engine/history` → `ansible_rc`. Un playbook en
            échec pendant la démo donne REMEDIATION_FAILED au dashboard.

      # Le noyau cryptographique ne répond plus : plus de signature d'anneau,
      # donc plus aucun paiement possible.
      - alert: NoyauCryptoIndisponible
        expr: shadow_crypto_core_ready == 0
        for: 30s
        labels: { severity: critical, pilier: DEV }
        annotations:
          summary: "payment-api n'a plus de noyau cryptographique"
          description: >-
            Chaque transaction renverra 503 (`crypto_last_error` dans
            /healthz). `docker compose up -d monero-crypto-core`.

      # La sonde de transaction légitime échoue : c'est le signal le plus
      # fiable que le paiement est cassé (et la fenêtre ML ne se remplit plus).
      - alert: SondeTransactionEnEchec
        expr: shadow_probe_ok == 0
        for: 1m
        labels: { severity: critical, pilier: DEV }
        annotations:
          summary: "la transaction de preuve échoue"
          description: >-
            `GET /tx/auto-probe/status` renvoie ok=false. C'est aussi ce que
            l'étape 4 du playbook vérifie : la remédiation conclura à un échec.

      # Le WAF est le point d'entrée : s'il tombe, l'attaquant n'est plus
      # contenu et le scénario de déception ne peut plus être montré.
      - alert: WafIndisponible
        expr: up{job="waf"} == 0
        for: 30s
        labels: { severity: warning, pilier: CYBER }
        annotations:
          summary: "waf est arrêté"
          description: >-
            Le trafic direct sur payment-api reste possible, mais la déception
            active n'est plus démontrable. `docker compose up -d waf`.

      # La déception n'est pas armée alors qu'un incident a eu lieu : le
      # playbook n'a pas fait son travail.
      - alert: DeceptionNonArmee
        expr: shadow_incidents_total > 0 and shadow_waf_deception_active == 0
        for: 2m
        labels: { severity: warning, pilier: CYBER }
        annotations:
          summary: "la déception n'est pas armée après un incident"
          description: >-
            Vérifier l'étape 1 du playbook (`/admin/redirect` sur le WAF) et
            `GET localhost:8085/admin/state`.

  # --- Back-office (consigne additionnelle) --------------------------------
  - name: backoffice
    rules:
      # Le moteur facial n'est pas chargé : plus aucune authentification
      # possible. C'est bloquant, donc critique.
      - alert: ReconnaissanceFacialeIndisponible
        expr: bo_face_engine_ready == 0
        for: 1m
        labels: { severity: critical, pilier: CYBER }
        annotations:
          summary: "back-office : moteur facial indisponible"
          description: >-
            Les modèles YuNet/SFace sont absents ou illisibles. Vérifier
            `curl localhost:8086/healthz` → `face_error`, puis
            `docker compose build backoffice`.

      # Le moteur de développement (stub) est actif : la reconnaissance est
      # factice. Acceptable en recette, JAMAIS en soutenance.
      - alert: ReconnaissanceFacialeFactice
        expr: bo_face_engine_stub == 1
        for: 5m
        labels: { severity: warning, pilier: CYBER }
        annotations:
          summary: "back-office : moteur facial STUB actif"
          description: >-
            `BO_FACE_ENGINE=stub` : aucun visage n'est réellement vérifié.
            Reconstruire l'image avec les modèles ONNX.

      # Aucun administrateur enrôlé : le back-office est inaccessible.
      - alert: AucunAdministrateurEnrole
        expr: bo_bootstrap_required == 1
        for: 10m
        labels: { severity: warning, pilier: CYBER }
        annotations:
          summary: "back-office : aucun administrateur avec visage"
          description: >-
            Renseigner BO_BOOTSTRAP_TOKEN puis ouvrir le back-office pour
            enrôler le premier administrateur.

      # Des comptes sont bloqués : soit une vraie attaque, soit une caméra
      # mal réglée. Dans les deux cas, il faut le voir avant la démo.
      - alert: ComptesBloques
        expr: bo_lockouts_active > 0
        for: 2m
        labels: { severity: warning, pilier: CYBER }
        annotations:
          summary: "{{ $value }} compte(s) back-office bloqué(s)"
          description: >-
            Blocage de 5 minutes après 2 échecs. Débloquer depuis l'écran
            « Habilitations » ou vérifier la caméra du PC hôte.

      # Le bandeau LED n'appelle plus le back-office : l'objet est débranché
      # ou a perdu le WiFi. Non bloquant par conception, mais à savoir.
      - alert: BandeauLedSilencieux
        expr: bo_led_last_seen_seconds > 30
        for: 2m
        labels: { severity: warning, pilier: DEV }
        annotations:
          summary: "le bandeau LED ESP8266 ne répond plus"
          description: >-
            Vérifier l'alimentation et le WiFi de l'ESP8266 (`pio device
            monitor`). L'authentification n'en dépend pas.

  - name: integrite
    rules:
      # Sans jeton de service, les endpoints d'administration sont FERMÉS
      # (503) : le playbook ne peut plus durcir ni mettre en quarantaine.
      # Fail-closed, donc bruyant — c'est voulu.
      - alert: JetonServiceNonConfigure
        expr: shadow_service_token_configured == 0
        for: 1m
        labels: { severity: critical, pilier: CYBER }
        annotations:
          summary: "SERVICE_TOKEN absent : administration et remédiation fermées"
          description: >-
            `python tools/init_env.py` puis `docker compose up -d`. Sans jeton,
            /admin/* et /incident répondent 503 : aucune remédiation autonome.

      # Le registre d'outputs est retombé en mémoire : un redémarrage de
      # payment-api effacerait la transaction de preuve. C'était le risque de
      # démonstration n°1 ; il est désormais visible au lieu d'être silencieux.
      - alert: RegistreNonPersistant
        expr: shadow_registry_durable == 0
        for: 1m
        labels: { severity: critical, pilier: DEV }
        annotations:
          summary: "le registre d'outputs n'est pas persistant"
          description: >-
            `/healthz` → `registry.durable: false`. Vérifier `DATABASE_URL` et
            `db-postgres` : sans persistance, un redémarrage perd les outputs
            et donc la transaction de preuve.

      # La base est tombée : plus de boutique, plus de registre persistant.
      - alert: BaseDeDonneesIndisponible
        expr: pg_up == 0
        for: 30s
        labels: { severity: critical, pilier: INFRA }
        annotations:
          summary: "PostgreSQL ne répond plus"
          description: >-
            `docker compose up -d db-postgres`. Conséquence : la boutique ne
            peut plus vendre et le registre retombe en mémoire.

      # Trop de connexions ouvertes : le pool est saturé, les requêtes vont
      # expirer. Se voit AVANT la panne, ce qui est tout l'intérêt.
      - alert: PoolPostgresSature
        expr: sum(pg_stat_activity_count) > 80
        for: 2m
        labels: { severity: warning, pilier: INFRA }
        annotations:
          summary: "{{ $value }} connexions PostgreSQL ouvertes"
          description: >-
            Vérifier les fuites de connexion dans `shop-api` et `payment-api`
            (`pg_stat_activity`). La limite par défaut est 100.

      # La base grossit : signe d'un journal non purgé ou d'un import massif.
      - alert: BasePostgresVolumineuse
        expr: pg_database_size_bytes{datname="shadow_settle"} > 2e9
        for: 5m
        labels: { severity: warning, pilier: INFRA }
        annotations:
          summary: "la base dépasse 2 Go"
          description: >-
            `SELECT relname, pg_size_pretty(pg_total_relation_size(relid)) FROM
            pg_catalog.pg_statio_user_tables ORDER BY 2 DESC;`

      # La boutique est le point d'entrée « client » du SI. Si elle tombe, il
      # n'y a plus de site vitrine ni de paiement.
      - alert: BoutiqueIndisponible
        expr: up{job="shop-api"} == 0
        for: 30s
        labels: { severity: critical, pilier: DEV }
        annotations:
          summary: "shop-api est arrêté"
          description: >-
            `docker compose up -d shop-api`. La base PostgreSQL est peut-être
            en cause : vérifier `docker compose ps db-postgres`.

      # Des paiements sont refusés : le registre cryptographique ou le noyau
      # est en cause. Les commandes échouées sont en base, avec leur motif.
      - alert: PaiementsBoutiqueEnEchec
        expr: increase(shop_payments_failed_total[10m]) > 0
        for: 1m
        labels: { severity: warning, pilier: DEV }
        annotations:
          summary: "{{ $value }} paiement(s) refusé(s) sur la boutique"
          description: >-
            Voir `GET localhost:8087/admin/orders` (statut `failed`) et
            `curl localhost:8080/healthz` → `crypto_core`.

      # L'assistant RAG ne répond plus : le pilier IA/DATA perd son accès au
      # dossier. Non bloquant pour le paiement, mais visible en démo.
      - alert: AssistantRagIndisponible
        expr: up{job="rag-assistant"} == 0
        for: 1m
        labels: { severity: warning, pilier: "IA/DATA" }
        annotations:
          summary: "rag-assistant est arrêté"
          description: >-
            `docker compose up -d rag-assistant`. L'index est dans l'image :
            un redémarrage suffit, aucun téléchargement n'est nécessaire.

      # Un service qui redémarre en boucle : c'est ainsi qu'un panic du noyau
      # Rust se manifestait (hex trop court). Le conteneur « Up » mentait.
      - alert: RedemarragesRepetes
        expr: changes(process_start_time_seconds[15m]) > 2
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} redémarre en boucle"
          description: >-
            Vérifier `docker compose logs --tail=50 {{ $labels.job }}`.
            Un redémarrage répété pendant la démo coûte la démonstration.

      # Un service injoignable tout court.
      - alert: ServiceInjoignable
        expr: up == 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} ne répond pas au scrape"
          description: "`docker compose ps {{ $labels.job }}`"
