# Provisionnement automatique des sources de données.
# Sans ce fichier, Grafana démarre avec zéro source et le dashboard importé
# affiche « datasource not found » — constaté en recette.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 10s

  # Loki est provisionné avec un lien vers Prometheus : dans Explore, on passe
  # d'une métrique à ses logs en un clic. C'est ce que le jury appelle « gérer
  # les logs des outils de supervision ».
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 500
      derivedFields:
        - name: service
          matcherRegex: '"service":"([^"]+)"'
          url: ''
          datasourceUid: prometheus
