# Provisionnement du dashboard : le fichier JSON est monté en lecture seule et
# rechargé toutes les 30 s. Aucun clic nécessaire après un `docker compose up`.
apiVersion: 1

providers:
  - name: resilience-alpha
    orgId: 1
    folder: RESILIENCE-ALPHA
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
