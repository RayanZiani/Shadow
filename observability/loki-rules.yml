# Règles d'alerte sur les LOGS — évaluées par Loki, poussées à Alertmanager.
#
# Complément de `alert.rules.yml` (métriques Prometheus). Une métrique dit
# « combien » ; un log dit « pourquoi ». Ces règles couvrent les erreurs qu'aucune
# métrique ne porte : un refus de paiement, une exception, un secret absent.
#
# Comme pour Prometheus, la liste des alertes qui déclenchent une remédiation
# est FERMÉE et vit dans `remediation-engine` (`ACTIONABLE_ALERTS`). Une alerte
# de log inconnue du moteur est journalisée sans ouvrir d'incident.

groups:
  - name: logs-erreurs
    interval: 30s
    rules:
      - alert: ErreurApplicative
        # Une seule ligne ERROR suffit : en démonstration, on n'a pas le temps
        # d'attendre un taux.
        expr: |
          sum by (service) (count_over_time({service=~".+"} |= "ERROR" [2m])) > 0
        for: 30s
        labels:
          severity: warning
          source: loki
        annotations:
          summary: "{{ $labels.service }} a journalisé une erreur"
          description: >-
            Chercher dans Grafana Explore :
            `{service="{{ $labels.service }}"}` puis filtrer `ERROR`.

      - alert: PaiementRefuse
        # La ligne « paiement refusé » est écrite par **shop-api**, pas par
        # payment-api (qui lève une HTTPException sans la journaliser). La règle
        # visait `payment-api` : elle ne pouvait donc jamais se déclencher.
        expr: |
          sum(count_over_time({service="shop-api"} |= "paiement refusé" [3m])) > 0
        for: 0s
        labels:
          severity: critical
          source: loki
        annotations:
          summary: "un paiement a été refusé par le registre"
          description: >-
            Vérifier `curl localhost:8080/healthz` (`crypto_core`) et
            `curl localhost:8087/admin/orders` (commandes `failed`).

      - alert: RemonteeDeBouclier
        # Un panic Rust se termine par « thread 'main' panicked ». Le conteneur
        # reste « Up » quelques secondes : sans cette règle, on ne voit rien.
        expr: |
          sum(count_over_time({service=~".+"} |= "panicked" [5m])) > 0
        for: 0s
        labels:
          severity: critical
          source: loki
        annotations:
          summary: "{{ $labels.service }} a paniqué"
          description: >-
            `docker compose logs --tail=100 {{ $labels.service }}`. Un panic
            est toujours un défaut de code, jamais une attaque réussie.

      - alert: JetonServiceAbsentDansLesLogs
        # La chaîne « SERVICE_TOKEN non configuré » n'apparaît que dans le
        # corps d'une HTTPException, pas dans un log. On cible le symptôme
        # réellement journalisé : un 503 sur une route d'administration.
        expr: |
          sum(count_over_time({service=~".+"} |= "503" [5m])) > 0
        for: 0s
        labels:
          severity: critical
          source: loki
        annotations:
          summary: "un service refuse de servir faute de jeton de service"
          description: >-
            `python tools/init_env.py` puis `docker compose up -d`. Les
            endpoints d'administration sont fermés (503) tant que le jeton
            n'est pas configuré.
