# RESILIENCE-ALPHA / SHADOW-SETTLE — orchestration complète.
#
#   cp .env.example .env
#   docker compose build        # ~6-8 min la première fois (torch, cargo)
#   docker compose up -d
#
# L'ordre n'est pas critique : les services tolèrent l'absence temporaire de
# leurs voisins et se resynchronisent. Guide détaillé (Docker/Colima, Rust,
# Python, Node, Vault, dépannage) : docs/INSTALLATION-LOCAL.md
#
# Le bloc `version:` a été retiré : Compose v2 le signale comme obsolète à
# chaque commande.

networks:
  shadow-net:
    driver: bridge

volumes:
  pg-data:
  vault-data:
  prometheus-data:
  grafana-data:
  bo-data:
  alertmanager-data:
  loki-data:
  promtail-positions:

services:
  # ---------- PILIER INFRA ----------
  db-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shadow_settle
      POSTGRES_USER: shadow
      # Mot de passe unique pour le poste de démonstration, surchargeable par
      # `.env`. L'ancienne version passait par un secret fichier : si le fichier
      # `secrets/pg_password.txt` manquait, `docker compose up` échouait avant
      # même de démarrer le premier conteneur, et DATABASE_URL contenait de son
      # côté un mot de passe codé en dur qui ne correspondait pas au secret.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shadow_local_dev}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [shadow-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadow -d shadow_settle"]
      interval: 5s
      timeout: 3s
      retries: 10


  # postgres_exporter : PostgreSQL porte désormais des données MÉTIER (commandes,
  # paiements) et le registre d'outputs. Sans ces métriques, une base saturée ou
  # un pool épuisé ne se voit nulle part.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://shadow:${POSTGRES_PASSWORD:-shadow_local_dev}@db-postgres:5432/shadow_settle?sslmode=disable"
    depends_on:
      db-postgres:
        condition: service_healthy
    ports: ["9187:9187"]
    networks: [shadow-net]

  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    volumes:
      - vault-data:/vault/file
    ports: ["8200:8200"]
    networks: [shadow-net]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - prometheus-data:/prometheus
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    ports: ["9090:9090"]
    networks: [shadow-net]


  # Alertmanager : reçoit les alertes Prometheus et les POUSSE vers le moteur
  # de remédiation. Le jeton de service est injecté au démarrage (jamais écrit
  # dans le fichier versionné).
  alertmanager:
    image: prom/alertmanager:latest
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
    volumes:
      - alertmanager-data:/alertmanager
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tpl:ro
    entrypoint:
      - /bin/sh
      - -c
      - >-
        sed "s|__SERVICE_TOKEN__|$${SERVICE_TOKEN}|"
        /etc/alertmanager/alertmanager.yml.tpl > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
        --storage.path=/alertmanager
    ports: ["9093:9093"]
    networks: [shadow-net]

  grafana:
    image: grafana/grafana:latest
    environment:
      # Pas de mot de passe par défaut en clair dans le code : la valeur de
      # démonstration est surchargeable par `.env`. Grafana exige un mot de
      # passe non trivial au premier démarrage.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-shadow_local_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana-dashboard.json:/etc/grafana/dashboards/resilience-alpha.json:ro
    ports: ["3001:3000"]
    networks: [shadow-net]

  # Loki : stockage des logs. Configuré pour de vrai — la version d'origine
  # démarrait sans configuration et ne collectait rien, ce qui est pire qu'un
  # service absent : il « Up » et il ment.
  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - loki-data:/loki
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - ./observability/loki-rules.yml:/loki/rules/fake/erreurs.yml:ro
    ports: ["3100:3100"]
    networks: [shadow-net]

  # Promtail : collecte les logs de TOUS les conteneurs et les pousse à Loki.
  # Le socket Docker est monté en lecture seule : un accès en écriture équivaut
  # à root sur l'hôte, et c'est exactement ce que le projet refuse ailleurs.
  promtail:
    image: grafana/promtail:latest
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    networks: [shadow-net]

  # ---------- PILIER DEV ----------
  monero-crypto-core:
    build: ./services/monero-crypto-core
    environment:
      RUST_LOG: info
    ports: ["8081:8081"]
    networks: [shadow-net]

  auth-service:
    build: ./services/auth-service
    environment:
      VAULT_ADDR: "http://vault:8200"
      # Vide par défaut : le service le signale dans /healthz
      # (`jwt_key_source: fallback_env`) au lieu de faire croire que Vault est
      # branché. Renseigner VAULT_TOKEN dans `.env` active la lecture réelle.
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      JWT_SIGNING_KEY_CACHE: ${JWT_SIGNING_KEY_CACHE:-dev-only-placeholder-rotate-me}
    depends_on: [vault]
    ports: ["8092:8082"]
    networks: [shadow-net]

  payment-api:
    build: ./services/payment-api
    environment:
      DATABASE_URL: "postgresql://shadow:${POSTGRES_PASSWORD:-shadow_local_dev}@db-postgres:5432/shadow_settle"
      CRYPTO_CORE_URL: "http://monero-crypto-core:8081"
      ML_DETECTOR_URL: "http://ml-detector:8083"
      REMEDIATION_STATE_URL: "http://remediation-engine:8084/state/report"
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      # PIN du terminal physique. Sans cette variable, le service en tire un au
      # hasard à chaque démarrage : le présentateur ne pourrait pas le taper.
      # `tools/init_env.py` le génère dans `.env`.
      TERMINAL_PIN: ${TERMINAL_PIN:-}
    depends_on:
      db-postgres:
        condition: service_healthy
      monero-crypto-core:
        condition: service_started
    ports: ["8080:8080"]
    networks: [shadow-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 12

  front-dashboard:
    build: ./front-dashboard
    environment:
      VITE_API_BASE: "http://localhost:8080"
      VITE_REMEDIATION_BASE: "http://localhost:8084"
      VITE_ML_BASE: "http://localhost:8083"
      # Back-office : authentification visage + mot de passe. La caméra est
      # celle du PC hôte, ouverte par le navigateur (getUserMedia). Ouvrir le
      # dashboard par http://localhost:5173 : une IP LAN n'est pas un « contexte
      # sécurisé » et le navigateur refuserait la caméra.
      VITE_BACKOFFICE_BASE: "http://localhost:8086"
    ports: ["5173:5173"]
    networks: [shadow-net]

  # Back-office protégé : identifiant → reconnaissance faciale (caméra USB du
  # PC hôte) → mot de passe. Gère aussi les habilitations et le bandeau LED
  # ESP8266. Voir services/backoffice/README.md.
  backoffice:
    build: ./services/backoffice
    environment:
      BO_DB_PATH: "/data/backoffice.db"
      BO_FACE_MODEL_DIR: "/app/models"
      BO_FACE_ENGINE: ${BO_FACE_ENGINE:-opencv}
      BO_FACE_THRESHOLD: ${BO_FACE_THRESHOLD:-0.40}
      # Jeton d'enrôlement du PREMIER administrateur. Vide = bootstrap fermé
      # (aucun compte ne peut être créé). À retirer de `.env` après usage.
      BO_BOOTSTRAP_TOKEN: ${BO_BOOTSTRAP_TOKEN:-}
      # 2 échecs puis 5 minutes, comme l'exige la consigne.
      BO_MAX_ATTEMPTS: ${BO_MAX_ATTEMPTS:-2}
      BO_LOCKOUT_SECONDS: ${BO_LOCKOUT_SECONDS:-300}
      LED_DEVICE_TOKEN: ${LED_DEVICE_TOKEN:-led-demo-token}
      BO_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      - bo-data:/data
    ports: ["8086:8086"]
    networks: [shadow-net]


  # ---------- PILIER DEV : boutique (site vitrine + back) ----------
  # Articles, panier, commandes, paiements et historique vivent dans PostgreSQL.
  # Le paiement passe par payment-api /tx/pay (signature d'anneau bLSAG).
  shop-api:
    build: ./services/shop-api
    environment:
      DATABASE_URL: "postgresql://shadow:${POSTGRES_PASSWORD:-shadow_local_dev}@db-postgres:5432/shadow_settle"
      PAYMENT_API_URL: "http://payment-api:8080"
      BACKOFFICE_URL: "http://backoffice:8086"
      # Accepté uniquement pour les outils et les tests ; le navigateur utilise
      # la session back-office, jamais ce jeton.
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
    depends_on:
      db-postgres:
        condition: service_healthy
      payment-api:
        condition: service_started
      backoffice:
        condition: service_started
    ports: ["8087:8087"]
    networks: [shadow-net]


  # ---------- PILIER IA / DATA : assistant RAG local ----------
  # Répond sur le dossier technique (docs/ + README) avec ses sources.
  # L'index est construit à la construction de l'image : aucun téléchargement
  # au démarrage. Ollama tourne sur le PC IA ; s'il est absent, le service
  # répond en extractif et le DIT dans /healthz.
  rag-assistant:
    build:
      context: .
      dockerfile: services/rag-assistant/Dockerfile
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["8091:8091"]
    networks: [shadow-net]

  # ---------- PILIER CYBER ----------
  shadow-api:
    build: ./services/shadow-api
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
    ports: ["8090:8090"]
    networks: [shadow-net]

  # Point d'entrée « client » : reverse proxy + déception active. C'est lui
  # que le playbook bascule vers le honeypot (étape 1), et c'est par lui que
  # passe le trafic attaquant dans la démonstration.
  waf:
    build: ./services/waf
    environment:
      WAF_UPSTREAM: "http://payment-api:8080"
      WAF_HONEYPOT: "http://shadow-api:8090"
      DECOY_AGE_THRESHOLD: ${DECOY_AGE_THRESHOLD:-8.0}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
    depends_on: [payment-api, shadow-api]
    ports: ["8085:8085"]
    networks: [shadow-net]

  # ---------- PILIER IA / DATA ----------
  ml-detector:
    build: ./services/ml-detector
    environment:
      REMEDIATION_WEBHOOK: "http://remediation-engine:8084/incident"
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
    depends_on: [remediation-engine]
    ports: ["8083:8083"]
    networks: [shadow-net]

  # rag-assistant:
  #   build: ./services/rag-assistant
  #   # Ollama tourne de préférence sur le PC IA dédié, pas ici.
  #   networks: [shadow-net]

  # ---------- PILIER INFRA : remédiation ----------
  remediation-engine:
    build: ./services/remediation-engine
    environment:
      ANSIBLE_PLAYBOOK: "/ansible/remediation_playbook.yml"
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      # Token Vault transmis au playbook (rotation de la clé JWT). Vide =
      # tâche sautée et signalée `skipped`, jamais un faux succès.
      VAULT_TOKEN: ${VAULT_TOKEN:-}
    volumes:
      - ./ansible:/ansible
    # PAS de /var/run/docker.sock ici. Il était monté pour une tâche de
    # redémarrage de payment-api qui n'a jamais fonctionné (client Docker absent
    # de l'image) et qui, si elle avait fonctionné, aurait détruit le registre
    # d'outputs en mémoire. Le socket Docker donne un accès équivalent root sur
    # l'hôte : le garder contredisait l'indicateur « accès du moteur de
    # remédiation maîtrisés ».
    ports: ["8084:8084"]
    networks: [shadow-net]
