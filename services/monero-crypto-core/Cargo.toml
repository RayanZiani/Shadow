[package]
name = "monero-crypto-core"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
curve25519-dalek = { version = "4", features = ["rand_core"] }
sha3 = "0.10"
rand_core = { version = "0.6", features = ["std"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
